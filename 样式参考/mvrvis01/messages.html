<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留言板 · Tnine</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235B8DEF'/%3E%3Ctext x='32' y='42' font-family='Inter,sans-serif' font-size='26' font-weight='700' fill='%23fff' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
</head>
<body>

<div class="read-progress-bar"><div id="read-progress"></div></div>

<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">Tnine</a>
    <nav class="nav-links">
      <a href="index.html" class="nav-link">首页</a>
      <a href="articles.html" class="nav-link">文章</a>
      <a href="moments.html" class="nav-link">朋友圈</a>
      <a href="messages.html" class="nav-link">留言</a>
    </nav>
    <div class="nav-right">
      <button class="theme-toggle" title="切换主题">🌙</button>
      <div id="nav-auth"></div>
    </div>
  </div>
</header>

<section class="page-head">
  <div class="container">
    <div class="page-title">留言板</div>
    <div class="page-sub">无需账号，留下你的足迹吧</div>
  </div>
</section>

<section class="section">
  <div class="container container-narrow">

    <!-- Message form -->
    <div class="message-form-card reveal">
      <div class="form-title">写留言 <span class="muted">· 公开留言所有人可见，私密留言仅站长可见</span></div>
      <form id="message-form">
        <div class="form-row">
          <div class="form-field">
            <label>昵称</label>
            <input id="msg-nick" maxlength="20" placeholder="你的昵称">
          </div>
        </div>
        <div class="form-field">
          <label>选择头像（可选，默认随机生成）</label>
          <div class="avatar-picker" id="avatar-picker"></div>
        </div>
        <div class="form-field">
          <label>内容</label>
          <textarea id="msg-content" rows="4" placeholder="想对站长说点什么…"></textarea>
        </div>
        <div class="privacy-row">
          <label class="radio-row"><input type="radio" name="privacy" value="public" checked><span class="radio-dot"></span>公开</label>
          <label class="radio-row"><input type="radio" name="privacy" value="private"><span class="radio-dot"></span>私密</label>
        </div>
        <button class="btn btn-primary" type="submit">发送留言</button>
      </form>
    </div>

    <!-- Message list -->
    <div class="message-list" id="message-list"></div>

  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-logo">Tnine</div>
    <div class="footer-text">© 2026 Tnine · 用爱与代码浇灌的数字花园</div>
  </div>
</footer>

<nav class="bottom-nav">
  <a href="index.html"><span class="bn-icon">🏠</span><span>首页</span></a>
  <a href="articles.html"><span class="bn-icon">📄</span><span>文章</span></a>
  <a href="moments.html"><span class="bn-icon">🕐</span><span>朋友圈</span></a>
  <a href="messages.html"><span class="bn-icon">💬</span><span>留言</span></a>
</nav>

<script src="js/data.js"></script>
<script src="js/markdown.js"></script>
<script src="js/main.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const s = Tnine.load().settings;
    document.title = "留言板 · " + s.siteTitle;
    var ft = document.querySelector(".footer-text");
    if (ft) ft.textContent = s.footer;
  });
</script>
</body>
</html>
