<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>朋友圈 · Tnine</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235B8DEF'/%3E%3Ctext x='32' y='42' font-family='Inter,sans-serif' font-size='26' font-weight='700' fill='%23fff' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
</head>
<body>

<div class="read-progress-bar"><div id="read-progress"></div></div>

<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">Tnine</a>
    <nav class="nav-links">
      <a href="index.html" class="nav-link">首页</a>
      <a href="articles.html" class="nav-link">文章</a>
      <a href="moments.html" class="nav-link">朋友圈</a>
      <a href="messages.html" class="nav-link">留言</a>
    </nav>
    <div class="nav-right">
      <button class="theme-toggle" title="切换主题">🌙</button>
      <div id="nav-auth"></div>
    </div>
  </div>
</header>

<section class="moments-hero">
  <div class="moments-cover">
    <div class="moments-cover-content">
      <div class="moments-title">朋友圈</div>
      <div class="moments-sub">生活碎片的收集册</div>
    </div>
    <div class="moments-profile">
      <img class="moments-profile-avatar" id="moments-profile-avatar" src="" alt="">
      <div class="moments-profile-name" id="moments-profile-name">Tnine</div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container container-narrow">
    <div class="moments-list" id="moments-list"></div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-logo">Tnine</div>
    <div class="footer-text">© 2026 Tnine · 用爱与代码浇灌的数字花园</div>
  </div>
</footer>

<nav class="bottom-nav">
  <a href="index.html"><span class="bn-icon">🏠</span><span>首页</span></a>
  <a href="articles.html"><span class="bn-icon">📄</span><span>文章</span></a>
  <a href="moments.html"><span class="bn-icon">🕐</span><span>朋友圈</span></a>
  <a href="messages.html"><span class="bn-icon">💬</span><span>留言</span></a>
</nav>

<div class="lightbox" id="lightbox"></div>

<script src="js/data.js"></script>
<script src="js/markdown.js"></script>
<script src="js/main.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const s = Tnine.load().settings;
    document.title = "朋友圈 · " + s.siteTitle;
    if (s.avatar) document.getElementById("moments-profile-avatar").src = s.avatar;
    document.getElementById("moments-profile-name").textContent = s.siteTitle || "Tnine";
    var ft = document.querySelector(".footer-text");
    if (ft) ft.textContent = s.footer;
  });
</script>
</body>
</html>
