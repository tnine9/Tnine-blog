<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 · Tnine CMS</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235B8DEF'/%3E%3Ctext x='32' y='42' font-family='Inter,sans-serif' font-size='26' font-weight='700' fill='%23fff' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
</head>
<body class="admin-body">

<!-- ===== Login ===== -->
<div class="admin-login" id="login-wrap">
  <div class="login-card">
    <div class="login-logo">Tnine</div>
    <div class="login-sub">管理后台 · 请输入密码</div>
    <form id="login-form">
      <input type="password" id="login-pwd" placeholder="登录密码（默认 admin123）" autocomplete="current-password">
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center">登 录</button>
    </form>
    <div class="login-hint">提示：可在「系统管理 → 安全」中修改密码</div>
  </div>
</div>

<!-- ===== Admin App ===== -->
<div class="admin-app hidden" id="admin-app">
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="admin-brand">
      <span class="brand-dot"></span>Tnine CMS
    </div>
    <nav class="admin-nav">
      <div class="admin-nav-item active" data-panel="dashboard"><span>📊</span><span>仪表盘</span></div>
      <div class="admin-nav-item" data-panel="blog"><span>📝</span><span>博客管理</span></div>
      <div class="admin-nav-item" data-panel="moments"><span>🕐</span><span>朋友圈管理</span></div>
      <div class="admin-nav-item" data-panel="messages"><span>💬</span><span>留言管理</span></div>
      <div class="admin-nav-item" data-panel="notifications"><span>🔔</span><span>通知中心</span></div>
      <div class="admin-nav-item" data-panel="settings"><span>⚙️</span><span>系统管理</span></div>
    </nav>
    <div class="admin-sidebar-foot">
      <a href="index.html" class="admin-foot-link">← 返回前台</a>
      <button class="admin-foot-link danger" data-logout>退出登录</button>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <button class="menu-btn" id="menu-btn">☰</button>
      <div class="admin-title" id="panel-title">仪表盘</div>
      <div class="admin-topbar-right">
        <a href="index.html" class="btn btn-ghost btn-sm">查看网站</a>
        <button class="btn btn-ghost btn-sm" data-logout>退出</button>
      </div>
    </header>

    <main class="admin-content">
      <div class="admin-panel active" id="panel-dashboard"></div>
      <div class="admin-panel" id="panel-blog"></div>
      <div class="admin-panel" id="panel-moments"></div>
      <div class="admin-panel" id="panel-messages"></div>
      <div class="admin-panel" id="panel-notifications"></div>
      <div class="admin-panel" id="panel-settings"></div>
    </main>
  </div>
</div>

<div class="admin-mask" id="admin-mask"></div>

<script src="js/data.js"></script>
<script src="js/markdown.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
