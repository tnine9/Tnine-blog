<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tnine · 记录技术、生活和思考</title>
<meta name="description" content="Tnine - 一个极简优雅的个人数字花园，记录技术、生活和思考。">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235B8DEF'/%3E%3Ctext x='32' y='42' font-family='Inter,sans-serif' font-size='26' font-weight='700' fill='%23fff' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
</head>
<body>

<!-- ===== Progress ===== -->
<div class="read-progress-bar"><div id="read-progress"></div></div>

<!-- ===== Navbar ===== -->
<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">Tnine</a>
    <nav class="nav-links">
      <a href="index.html" class="nav-link">首页</a>
      <a href="articles.html" class="nav-link">文章</a>
      <a href="moments.html" class="nav-link">朋友圈</a>
      <a href="messages.html" class="nav-link">留言</a>
    </nav>
    <div class="nav-right">
      <button class="theme-toggle" title="切换主题">🌙</button>
      <div id="nav-auth"></div>
    </div>
  </div>
</header>

<!-- ===== Hero ===== -->
<section class="hero" id="hero">
  <div class="hero-bg" id="hero-bg"></div>
  <div class="hero-grad"></div>
  <div class="hero-content">
    <div class="hero-avatar-wrap">
      <img class="hero-avatar" id="hero-avatar" src="" alt="avatar">
      <span class="hero-avatar-ring"></span>
    </div>
    <h1 class="hero-name" id="hero-name">Tnine</h1>
    <p class="hero-slogan" id="hero-slogan">记录技术、生活和思考</p>
    <p class="hero-sub" id="hero-sub">一个关于代码、旅行与日常的数字花园</p>
    <div class="hero-actions">
      <a class="btn btn-primary btn-lg" href="articles.html">进入文章</a>
      <a class="btn btn-ghost btn-lg" href="moments.html">查看朋友圈</a>
    </div>
    <div class="hero-scroll"><div class="mouse"><div class="wheel"></div></div><span>向下滚动</span></div>
  </div>
</section>

<!-- ===== Announcement ===== -->
<div class="announcement hidden" id="announcement">
  <div class="container"><span class="ann-icon">🌱</span><span id="ann-text"></span></div>
</div>

<!-- ===== Timeline ===== -->
<section class="timeline-section">
  <div class="container">
    <div class="section-head reveal">
      <div class="section-title">时间线</div>
      <div class="section-sub">文章 · 朋友圈 · 留言，都在这里</div>
    </div>
    <div class="timeline" id="timeline"></div>
    <div style="text-align:center;margin-top:48px">
      <a class="btn btn-ghost" href="articles.html">查看全部文章 →</a>
    </div>
  </div>
</section>

<!-- ===== Footer ===== -->
<footer class="footer">
  <div class="container">
    <div class="footer-logo">Tnine</div>
    <div class="footer-text" id="footer-text">© 2026 Tnine · 用爱与代码浇灌的数字花园</div>
  </div>
</footer>

<!-- ===== Mobile bottom nav ===== -->
<nav class="bottom-nav">
  <a href="index.html"><span class="bn-icon">🏠</span><span>首页</span></a>
  <a href="articles.html"><span class="bn-icon">📄</span><span>文章</span></a>
  <a href="moments.html"><span class="bn-icon">🕐</span><span>朋友圈</span></a>
  <a href="messages.html"><span class="bn-icon">💬</span><span>留言</span></a>
</nav>

<script src="js/data.js"></script>
<script src="js/markdown.js"></script>
<script src="js/main.js"></script>
<script>
  // home-only: apply site settings to hero + announcement + footer
  (function () {
    const s = Tnine.load().settings;
    document.title = s.siteTitle + " · " + s.description;
    document.getElementById("hero-name").textContent = s.siteTitle || "Tnine";
    document.getElementById("hero-slogan").textContent = s.description || "记录技术、生活和思考";
    if (s.avatar) document.getElementById("hero-avatar").src = s.avatar;
    if (s.banner) document.getElementById("hero-bg").style.backgroundImage = "url(" + s.banner + ")";
    const ann = document.getElementById("announcement");
    if (s.announcement) { ann.classList.remove("hidden"); document.getElementById("ann-text").textContent = s.announcement; }
    document.getElementById("footer-text").textContent = s.footer;
  })();
</script>
</body>
</html>
