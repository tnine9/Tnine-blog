<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Tnine
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}?v=5"
    >

    {% block extra_head %}
    {% endblock %}
</head>

<body>

<header class="site-header">

    <div class="container header-inner">

        <a href="/" class="logo">
            Tnine
        </a>

        <nav>

            <a href="/">
                首页
            </a>

            <a href="#">
                记录
            </a>

            <a href="#">
                朋友圈
            </a>

            {% if is_admin %}

                <span class="user-status">
                    👤 {{ admin_username }}
                </span>

                <a href="/admin">
                    管理后台
                </a>

                <a href="/admin/new">
                    写文章
                </a>

                <a href="/admin/logout">
                    退出登录
                </a>

            {% else %}

                <a
                    href="/admin/login"
                    class="login-link"
                >
                    登录
                </a>

            {% endif %}

        </nav>

    </div>

</header>


<main>

    {% block content %}
    {% endblock %}

</main>


<footer class="site-footer">

    <p>
        © 2026 Tnine
    </p>

</footer>

<!-- ==================================================
     游客昵称弹窗
     ================================================== -->

<div
    id="nickname-modal"
    class="nickname-modal"
>


    <div
        class="nickname-modal-backdrop"
    ></div>


    <div
        class="nickname-modal-box"
    >

        <h3>
            留下你的名字
        </h3>


        <p>
            点赞和评论需要一个昵称
        </p>


        <input
            id="nickname-input"
            type="text"
            maxlength="50"
            placeholder="请输入昵称"
        >


        <div
            class="nickname-modal-actions"
        >

            <button
                id="nickname-cancel"
            >
                取消
            </button>


            <button
                id="nickname-confirm"
            >
                确定
            </button>

        </div>


    </div>


</div>

</body>

</html>
