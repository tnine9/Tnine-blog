<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Tnine
        {% endblock %}
    </title>

<link rel="stylesheet"
      href="{{ url_for('static', path='css/style.css') }}?v=5">

<link rel="stylesheet"
      href="{{ url_for('static', path='css/article.css') }}?v=1">

<link rel="stylesheet"
      href="{{ url_for('static', path='css/admin.css') }}">

<link rel="stylesheet"
      href="{{ url_for('static', path='css/editor.css') }}?v=1">

<link rel="stylesheet"
      href="{{ url_for('static', path='css/moment.css') }}">

<link rel="stylesheet"
      href="{{ url_for('static', path='css/modal.css') }}">

      
    {% block extra_head %}
    {% endblock %}
</head>

<body>

<header class="site-header">

    <div class="container header-inner">

        <a href="/" class="logo">
            Tnine
        </a>

        <nav>

            <a href="/">
                首页
            </a>

            <a href="#">
                记录
            </a>

            <a href="#">
                朋友圈
            </a>

            {% if is_admin %}

                <span class="user-status">
                    👤 {{ admin_username }}
                </span>

                <a href="/admin">
                    管理后台
                </a>

                <a href="/admin/new">
                    写文章
                </a>

                <a href="/admin/logout">
                    退出登录
                </a>

            {% else %}

                <a
                    href="/admin/login"
                    class="login-link"
                >
                    登录
                </a>

            {% endif %}

        </nav>

    </div>

</header>


<main>

    {% block content %}
    {% endblock %}

    {% include "nickname_modal.html" %}

</main>


<footer class="site-footer">

    <p>
        © 2026 Tnine
    </p>

</footer>

<script src="{{ url_for('static', path='js/moment.js') }}?v=2"></script>

<script src="{{ url_for('static', path='js/main.js') }}?v=2"></script>


</body>

</html>
