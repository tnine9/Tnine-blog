<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">


    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!-- 明暗主题：优先用户手动选择，否则跟随系统（在样式加载前执行，避免闪烁） -->

    <script>

        (function () {

            try {

                var saved =
                    localStorage.getItem(
                        "tnine-theme"
                    );


                var dark =
                    saved === "dark" ||
                    (
                        !saved &&
                        window.matchMedia &&
                        window.matchMedia(
                            "(prefers-color-scheme: dark)"
                        ).matches
                    );


                if (dark) {

                    document.documentElement.setAttribute(
                        "data-theme",
                        "dark"
                    );

                }

            } catch (e) { }

        })();

    </script>



    <title>

        {% block title %}
        Tnine
        {% endblock %}

    </title>



    <!-- 基础变量 -->

    <link rel="stylesheet"
          href="{{ url_for('static', path='css/variables.css') }}?v=3">



    <!-- 基础样式 -->

    <link rel="stylesheet"
          href="{{ url_for('static', path='css/base.css') }}?v=3">



    <!-- 布局 -->

    <link rel="stylesheet"
          href="{{ url_for('static', path='css/layout.css') }}?v=4">



    <!-- 组件 -->

    <link rel="stylesheet"
          href="{{ url_for('static', path='css/components.css') }}?v=4">



    <!-- 页面 -->

    <link rel="stylesheet"
          href="{{ url_for('static', path='css/article.css') }}?v=5">


    <link rel="stylesheet"
          href="{{ url_for('static', path='css/moment.css') }}?v=4">


    <link rel="stylesheet"
          href="{{ url_for('static', path='css/admin.css') }}?v=3">


    <link rel="stylesheet"
          href="{{ url_for('static', path='css/editor.css') }}?v=3">


    <link rel="stylesheet"
          href="{{ url_for('static', path='css/modal.css') }}?v=3">



    {% block extra_head %}
    {% endblock %}


</head>



<body>



<header class="site-header glass-header">


    <div class="container header-inner">






        <!-- 导航 -->

<nav class="site-nav">


    <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">
        首页
    </a>


    <a href="/articles" class="{% if request.url.path in ['/articles'] %}active{% endif %}">
        文章
    </a>


    <a href="/moments" class="{% if request.url.path in ['/moments'] or request.url.path.startswith('/moment/') %}active{% endif %}">
        朋友圈
    </a>


    <a href="/messages" class="{% if request.url.path in ['/messages'] or request.url.path.startswith('/message/') %}active{% endif %}">
        留言
    </a>




    <!-- 主题切换按钮 -->


    <button
        class="theme-toggle"
        id="themeToggle"
        type="button"
        aria-label="切换明暗主题"
        title="切换明暗主题"
    >

        <svg
            class="icon-moon"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        >

            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>

        </svg>


        <svg
            class="icon-sun"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        >

            <circle cx="12" cy="12" r="5"></circle>

            <line x1="12" y1="1" x2="12" y2="3"></line>

            <line x1="12" y1="21" x2="12" y2="23"></line>

            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>

            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>

            <line x1="1" y1="12" x2="3" y2="12"></line>

            <line x1="21" y1="12" x2="23" y2="12"></line>

            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>

            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>

        </svg>

    </button>




    {% if is_admin %}


    <!-- 用户头像菜单 -->


    <div class="user-menu">


        <button
            class="user-avatar"
            id="userMenuButton"
        >

            {{ admin_username[0] }}

        </button>



        <div
            class="user-dropdown"
            id="userDropdown"
        >


            <div class="dropdown-user">


                <div class="dropdown-avatar">

                    {{ admin_username[0] }}

                </div>


                <div>

                    <div class="dropdown-name">

                        {{ admin_username }}

                    </div>


                    <div class="dropdown-role">

                        Administrator

                    </div>


                </div>


            </div>




            <a href="/admin">

                进入后台

            </a>




            <div class="dropdown-divider"></div>



            <a 
                href="/admin/logout"
                class="logout-link"
            >

                退出登录

            </a>



        </div>


    </div>




    {% else %}



    <a href="/admin/login">

        登录

    </a>



    {% endif %}



</nav>




    </div>



</header>




<main class="main-layout">



    <div class="page-container">


        {% block content %}

        {% endblock %}



    </div>



    {% include "nickname_modal.html" %}



</main>




<footer class="site-footer">


    <div class="container footer-inner">


        <div class="footer-brand">

            <span class="footer-logo">

                Tnine

            </span>

            <p class="footer-desc">

                记录文字与生活的小站

            </p>

        </div>


        <div class="footer-links">

            <a href="/">首页</a>

            <a href="/articles">文章</a>

            <a href="/moments">朋友圈</a>

            <a href="/messages">留言</a>

        </div>


        <div class="footer-meta">

            <p>

                © 2026 Tnine

            </p>

        </div>

    </div>


</footer>




<!-- 图片查看器 -->

<div id="image-viewer">


<button
class="viewer-prev"
onclick="showPrevImage()"
>
‹
</button>



<img
id="viewer-image"
>



<button
class="viewer-next"
onclick="showNextImage()"
>
›
</button>



</div>




<script src="{{ url_for('static', path='js/moment.js') }}?v=3"></script>


<script src="{{ url_for('static', path='js/main.js') }}?v=4"></script>


<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>


</body>


</html>
