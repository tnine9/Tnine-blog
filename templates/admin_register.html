{% extends "base.html" %}


{% block title %}
创建管理员 - Tnine
{% endblock %}


{% block content %}

<main class="container admin-page">

    <section class="login-page">

        <div class="login-card">

            <div class="login-header">

                <h1>
                    创建管理员
                </h1>

                <p>
                    第一次使用 Tnine，请先创建管理员账号。
                </p>

            </div>


            {% if error %}

            <div class="login-error">
                {{ error }}
            </div>

            {% endif %}


            <form
                method="post"
                action="/admin/register"
                class="article-form"
            >

                <div class="form-group">

                    <label for="username">
                        管理员用户名
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="请输入管理员用户名"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        密码
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="至少 6 位"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm_password">
                        确认密码
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="再次输入密码"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <button type="submit">
                    创建管理员
                </button>

            </form>

        </div>

    </section>

</main>

{% endblock %}
