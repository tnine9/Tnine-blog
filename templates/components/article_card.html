<article 
    class="content-card article-card"
    data-url="/article/{{ item.data.id }}"
>



    <div class="article-card-top">

        {% if item.data.status == "draft" and is_admin %}

        <span class="article-draft-badge">
            草稿
        </span>

        {% endif %}


        <div class="article-date">

            {{
            item.data.created_at.strftime("%Y-%m-%d")
            }}

        </div>

    </div>



    <!-- 标题 -->

    <h2 class="article-title">

        <a href="/article/{{ item.data.id }}">

            {{ item.data.title }}

        </a>

    </h2>



    <!-- 摘要 -->

    {% if item.data.summary %}

    <p class="article-summary">

        {{ item.data.summary }}

    </p>

    {% endif %}



    <!-- 互动统计 -->

    <div class="article-card-stats">

        <span class="article-stat">

            <span class="stat-icon">👁</span>

            {{ item.data.views }}

            <span class="stat-label">浏览</span>

        </span>


        <span class="article-stat">

            <span class="stat-icon">❤️</span>

            {{ item.data.like_count }}

            <span class="stat-label">点赞</span>

        </span>


        <span class="article-stat">

            <span class="stat-icon">💬</span>

            {{ item.data.comment_count }}

            <span class="stat-label">评论</span>

        </span>

    </div>



</article>
