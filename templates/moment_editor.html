{% extends "base.html" %}


{% block title %}
发布朋友圈 - {{ site_name }}
{% endblock %}



{% block content %}


<section class="page-content">


<header class="section-header section-header-stack">

<div class="section-header-top">

<h1 class="section-title">
{% if moment %}
编辑朋友圈
{% else %}
发布朋友圈
{% endif %}
</h1>

</div>

<p class="section-subtitle">
{% if moment %}
{{ moment.created_at.strftime("%Y-%m-%d %H:%M") }}
{% else %}
记录生活碎片，分享此刻心情
{% endif %}
</p>

</header>




<div class="moment-editor-card">



<form
method="post"
action="/admin/moment/create"
enctype="multipart/form-data"
>



<textarea
class="moment-editor-textarea"
name="content"
placeholder="这一刻想说什么..."
rows="6"
required
></textarea>




<div class="moment-upload-area">


<label class="upload-button">


＋ 添加照片


<input
id="moment-image-input"
type="file"
name="images"
multiple
accept="image/*"
hidden
>


</label>



<span class="upload-tip">

最多上传9张照片

</span>



</div>





<div
id="image-preview"
class="image-preview-grid"
>


</div>






<button
class="action-button"
type="submit"
>

{% if moment %}
保存修改
{% else %}
发布
{% endif %}

</button>




</form>


</div>



</section>





<script>


const input =
document.getElementById(
"moment-image-input"
);


const preview =
document.getElementById(
"image-preview"
);



let files=[];

// 编辑模式无上传框时跳过图片交互
const hasUpload = input && preview;

if (hasUpload) {

// ===============================
// 选择图片
// ===============================

input.addEventListener(
"change",
function(){


files=[
...files,
...input.files
];



if(files.length>9){


alert(
"最多只能上传9张图片"
);


files =
files.slice(0,9);


}



updateInput();


renderPreview();


});

}






// ===============================
// 同步 input 文件
// ===============================


function updateInput(){



const dt =
new DataTransfer();



files.forEach(
file=>{

dt.items.add(file);

}

);



input.files =
dt.files;



}







// ===============================
// 渲染预览
// ===============================


function renderPreview(){



preview.innerHTML="";



files.forEach(
(file,index)=>{


const reader =
new FileReader();



reader.onload=function(e){



const box =
document.createElement(
"div"
);



box.className=
"preview-item";



box.draggable=true;



box.dataset.index=index;




box.innerHTML=`

<img src="${e.target.result}">



<div class="preview-actions">


<button
type="button"
onclick="removeImage(${index})"
>
删除
</button>


<button
type="button"
onclick="previewImage(${index})"
>
放大
</button>


</div>


`;



preview.appendChild(box);



}



reader.readAsDataURL(file);



});



}




// ===============================
// 删除
// ===============================


function removeImage(index){


files.splice(
index,
1
);


updateInput();


renderPreview();


}






// ===============================
// 放大
// ===============================


function previewImage(index){


const url =
URL.createObjectURL(
files[index]
);



// openImageViewer 接收图片数组与索引
openImageViewer(
[url],
0
);


}






// ===============================
// 拖动排序
// ===============================


let dragIndex=null;



preview.addEventListener(
"dragstart",
function(e){


dragIndex =
Number(
e.target.dataset.index
);



});






preview.addEventListener(
"dragover",
function(e){


e.preventDefault();


});






preview.addEventListener(
"drop",
function(e){


e.preventDefault();



const targetIndex =
Number(
e.target.closest(
".preview-item"
).dataset.index
);




if(
dragIndex===null ||
dragIndex===targetIndex
){

return;

}





const moveFile =
files.splice(
dragIndex,
1
)[0];



files.splice(
targetIndex,
0,
moveFile
);



updateInput();


renderPreview();



dragIndex=null;



});



</script>

<script>


document.addEventListener(
"DOMContentLoaded",
function(){


const preview =
document.getElementById(
"image-preview"
);



if(!preview){
    return;
}



// CDN 未加载时（离线环境）跳过拖动排序，避免报错中断
if(
    typeof Sortable === "undefined"
){
    return;
}


new Sortable(
preview,
{


animation:250,


ghostClass:
"image-ghost",


chosenClass:
"image-chosen",


dragClass:
"image-drag",



onEnd:function(){


console.log(
"新的顺序:",
this.toArray()
);


}

}
);



});



</script>

{% endblock %}
