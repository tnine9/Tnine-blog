<!-- ==================================================
     昵称输入弹窗
     ================================================== -->

<div
    class="nickname-modal"
    id="nickname-modal"
>


    <div
        class="nickname-modal-backdrop"
    ></div>



    <div
        class="nickname-modal-box"
    >


        <h3>
            留下你的昵称
        </h3>


        <p class="nickname-modal-description">
            参与点赞或评论需要先留下昵称
        </p>



        <input
            type="text"
            class="nickname-input"
            id="nickname-input"
            maxlength="15"
            placeholder="请输入昵称"
        >



        <div
            class="nickname-modal-actions"
        >

            <button
                type="button"
                class="nickname-cancel"
                id="nickname-cancel"
            >
                取消
            </button>



            <button
                type="button"
                class="nickname-confirm"
                id="nickname-confirm"
            >
                确认
            </button>


        </div>


    </div>


</div>
