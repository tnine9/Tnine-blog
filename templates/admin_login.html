{% extends "base.html" %}

{% block title %}
管理员登录 - Tnine
{% endblock %}


{% block content %}

<main class="container admin-page">

    <section class="login-page">

        <div class="login-card">

            <div class="login-header">

                <h1>
                    管理员登录
                </h1>

                <p>
                    登录后管理你的博客内容。
                </p>

            </div>


            {% if error %}

            <div class="login-error">
                {{ error }}
            </div>

            {% endif %}


            {% if need_initial_password %}

            <div class="login-error">

                系统尚未初始化管理员账号。请先设置环境变量
                <code>TNINE_ADMIN_INITIAL_PASSWORD</code>
                并重启服务，将自动创建固定管理员
                <strong>admin</strong>。

            </div>

            {% endif %}


            <form
                method="post"
                action="/admin/login"
                class="article-form"
            >

                <div class="form-group">

                    <label for="username">
                        用户名
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="请输入管理员用户名"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        密码
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="请输入管理员密码"
                        required
                    >

                </div>


                <button type="submit">
                    登录
                </button>

            </form>

        </div>

    </section>

</main>

{% endblock %}
